<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Ders Takip</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121c2d;--line:#26344b;--text:#f2f5fb;--muted:#9aa9bf;--accent:#83a9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#111d31,#080d17 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px calc(32px + env(safe-area-inset-bottom))}header{padding:12px 2px 20px}h1{font-size:30px;margin:0 0 6px}header p,.notice,footer{color:var(--muted)}header p{margin:0;font-size:14px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.btn{border:1px solid var(--line);background:#1a2940;color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:650;cursor:pointer}.btn.primary{background:#dce7ff;color:#13203a;border-color:#dce7ff}.course{background:rgba(18,28,45,.96);border:1px solid var(--line);border-radius:18px;margin:14px 0;padding:16px}.course-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.course h2{font-size:19px;margin:0 0 5px}.schedule{color:var(--muted);font-size:13px}.count{font-weight:750;background:#202e45;border-radius:10px;padding:8px 10px;white-space:nowrap}.sessions{margin-top:14px;display:grid;gap:8px}.session{display:flex;align-items:center;gap:10px;padding:10px;background:#0d1625;border:1px solid #202e43;border-radius:12px}.session-info{min-width:0;flex:1}.session-date{font-weight:650;font-size:14px}.session-note{font-size:12px;color:var(--muted);margin-top:3px}.marks{display:flex;gap:6px}.mark{font-size:21px;line-height:1;border:1px solid #34445b;border-radius:10px;background:#172337;width:43px;height:42px;cursor:pointer;opacity:.5}.mark.active{opacity:1;outline:2px solid var(--accent);background:#253a5c}.empty,.notice{font-size:13px;color:var(--muted)}.empty{padding:12px 4px}.add-session{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.add-session input,.edit-schedule{width:100%;min-width:0;background:#0b1422;color:var(--text);border:1px solid #34445b;border-radius:10px;padding:10px;font:inherit;font-size:14px}.wide{grid-column:1/-1}.course-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}footer{font-size:12px;line-height:1.5;text-align:center;margin:24px 4px 0}input[type=file]{display:none}@media(min-width:560px){.course{padding:19px}.add-session{grid-template-columns:1fr 1fr 1.2fr auto}.wide{grid-column:auto}}
</style></head><body><main><header><h1>📚 Ders Takip</h1><p>Yoklamalarını işaretle, katılımını kolayca takip et.</p></header><div class="top-actions"><button class="btn primary" id="exportBtn">Yedeği dışa aktar</button><button class="btn" id="importBtn">Yedek içe aktar</button><input id="importFile" type="file" accept="application/json,.json"><button class="btn" id="resetBtn">Tüm kayıtları sıfırla</button></div><p class="notice">Kayıtlar bu cihazın ve tarayıcının içinde saklanır. Tarayıcı verilerini silmeden önce yedek al.</p><div id="courses"></div><footer>Bu cihazda yerel olarak saklanır. Oturum ekleyebilir, ders gün ve saatlerini düzenleyebilirsin.</footer></main><script>
const initial=["BLGM321","BLGM325","BLGM353","BLGM371","MATE332"].map(id=>({id,name:id,schedule:"Ders gününü ve saatini düzenle",sessions:[]}));const KEY="dersTakip.v1";let courses;try{courses=JSON.parse(localStorage.getItem(KEY))||initial.map(c=>({...c,sessions:[]}))}catch(e){courses=initial.map(c=>({...c,sessions:[]}))}function save(){localStorage.setItem(KEY,JSON.stringify(courses))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){document.getElementById("courses").innerHTML=courses.map(c=>{let a=c.sessions.filter(s=>s.status==="yes").length,m=c.sessions.filter(s=>s.status==="yes"||s.status==="no").length;return `<section class="course" data-course="${esc(c.id)}"><div class="course-head"><div style="flex:1;min-width:0"><h2>${esc(c.name)}</h2><div class="schedule">${esc(c.schedule||"Ders programı eklenmedi")}</div></div><div class="count">${a}/${m}</div></div><div class="course-tools"><button class="btn" data-action="schedule">Programı düzenle</button></div><div class="sessions">${c.sessions.length?c.sessions.map((s,i)=>`<div class="session"><div class="session-info"><div class="session-date">${esc(s.date||"Tarih belirtilmedi")}</div><div class="session-note">${esc(s.note||"Ders oturumu")}</div></div><div class="marks"><button class="mark ${s.status==="yes"?"active":""}" title="Katıldım" aria-label="Katıldım" data-action="yes" data-index="${i}">✅</button><button class="mark ${s.status==="no"?"active":""}" title="Katılmadım" aria-label="Katılmadım" data-action="no" data-index="${i}">❌</button></div></div>`).join(""):`<div class="empty">Henüz oturum eklenmedi.</div>`}</div><form class="add-session"><input name="date" type="date" aria-label="Ders tarihi" required><input name="note" placeholder="Saat / not (isteğe bağlı)" aria-label="Saat veya not"><button class="btn primary wide" type="submit">+ Oturum ekle</button></form></section>`}).join("")}document.getElementById("courses").addEventListener("click",e=>{let b=e.target.closest("button[data-action]");if(!b)return;let sec=b.closest(".course"),c=courses.find(x=>x.id===sec.dataset.course),act=b.dataset.action;if(act==="schedule"){let v=prompt("Bu dersin gün ve saat bilgisi:",c.schedule);if(v!==null){c.schedule=v.trim();save();render()}return}let i=Number(b.dataset.index);if(!c.sessions[i])return;c.sessions[i].status=act;save();render()});document.getElementById("courses").addEventListener("submit",e=>{if(!e.target.matches(".add-session"))return;e.preventDefault();let sec=e.target.closest(".course"),c=courses.find(x=>x.id===sec.dataset.course),fd=new FormData(e.target);c.sessions.push({date:fd.get("date"),note:String(fd.get("note")||"").trim(),status:""});c.sessions.sort((a,b)=>(a.date||"").localeCompare(b.date||""));save();render()});document.getElementById("exportBtn").onclick=()=>{let blob=new Blob([JSON.stringify({app:"Ders Takip",version:1,courses},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ders-takip-yedek.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.courses)||!d.courses.every(c=>c.id&&Array.isArray(c.sessions)))throw Error();courses=initial.map(base=>{let found=d.courses.find(c=>c.id===base.id);return found?{...base,...found}:base});save();render();alert("Yedek başarıyla yüklendi.")}catch(err){alert("Bu dosya geçerli bir Ders Takip yedeği değil.")}e.target.value=""};document.getElementById("resetBtn").onclick=()=>{if(confirm("Tüm ders ve yoklama kayıtları silinsin mi? Önce yedek aldığından emin ol.")){courses=initial.map(c=>({...c,sessions:[]}));save();render()}};render();
</script></body></html>
